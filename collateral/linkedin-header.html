<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Roc Startup Week LinkedIn Header</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    #creative { position: relative; width: 100%; height: 100%; background: #f7f4f0; }
    .city { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; }
    .wash { position: absolute; inset: 0; background: rgba(247,244,240,.28); }
    .logo { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); height: 54%; width: auto; }
    .accent { position: absolute; right: 5.5%; top: 16%; width: 13.5%; height: 3%; background: #ed1c24; }
  </style>
</head>
<body>
  <main id="creative" data-ready="true">
    <img class="city" src="../images/rochester-skyline-with-flowers.jpg" alt="Rochester skyline">
    <div class="wash" aria-hidden="true"></div>
    <img class="logo" src="../images/brand/roc-startup-week-full-color-transparent.png" alt="Roc Startup Week">
    <div class="accent" aria-hidden="true"></div>
  </main>
</body>
</html>
